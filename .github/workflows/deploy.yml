name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_call:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every run rebuilds from the head of main, so the newest run supersedes any
    # older one: cancel it rather than race it for the data/ push and gh-pages.
    # Job-level, so callers via workflow_call share the same group.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run cache
      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new cached data to commit"
          else
            git commit -m "chore: update cached issue data [skip ci]"
            git pull --rebase
            git push
          fi
      - run: npm run freeze
      - run: npm run build
        env:
          VITE_PRERELEASE_PASSWORD_HASH: ${{ secrets.PRERELEASE_PASSWORD_HASH }}
      - run: npm run prerender
        env:
          VITE_SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
